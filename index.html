<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旅旅醬 Travel Buddy</title><style>:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#203347;background:#f5f8fc}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#183e68,#477c9d);color:white;padding:52px 20px;text-align:center}header h1{font-size:clamp(30px,5vw,48px);margin:0}header p{opacity:.9}main{max-width:1100px;margin:30px auto;padding:0 18px}.panel{background:white;border:1px solid #e0e8ef;border-radius:18px;padding:24px;margin-bottom:22px;box-shadow:0 6px 22px #1b45600c}h2{margin:0 0 20px;font-size:22px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}label{display:block;font-weight:650;font-size:14px}input,select,textarea{width:100%;border:1px solid #cad7e2;border-radius:10px;padding:12px;font:inherit;margin-top:7px;background:#fff}textarea{min-height:75px}button{background:#246b92;color:white;border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer}button:hover{background:#185373}.secondary{background:#eaf2f7;color:#245474}.secondary:hover{background:#dceaf4}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.muted{color:#65778b;font-size:14px}.day{border-left:4px solid #3982a5;background:#f5f9fc;padding:16px;margin:14px 0;border-radius:0 12px 12px 0}.day h3{margin:0 0 8px}.day ul{margin:8px 0;padding-left:22px;line-height:1.9}.pill{display:inline-block;background:#e5f2f8;color:#235a7c;padding:6px 10px;border-radius:100px;margin:3px;font-size:13px}.budget{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.budget div{background:#f0f6fa;padding:15px;border-radius:12px}.budget strong{display:block;font-size:20px;margin-top:6px}#result{display:none}footer{text-align:center;color:#6c7b88;padding:24px}.warning{color:#9b5d10}@media(max-width:650px){.grid,.budget{grid-template-columns:1fr}.panel{padding:18px}}</style></head><body><header><h1>旅旅醬 Travel Buddy</h1><p>把想去的地方，變成一趟專屬旅行。</p></header><main><section class="panel"><h2>01 · 你的旅行設定</h2><div class="grid"><label>目的地<select id="destination"><option value="沖繩">沖繩</option><option value="東京">東京</option><option value="首爾">首爾</option><option value="瑞士">瑞士</option></select></label><label>出發日期<input id="start" type="date"></label><label>結束日期<input id="end" type="date"></label><label>旅行人數<input id="people" type="number" min="1" max="30" value="5"></label><label>每人總預算（新台幣）<input id="budget" type="number" min="1000" value="20000"></label><label>旅行步調<select id="pace"><option value="平衡">舒適與充實平衡</option><option value="悠閒">悠閒慢遊</option><option value="充實">充實探索</option></select></label></div><p><label>必去景點（以逗號或換行分隔）<textarea id="wishes" placeholder="例如：美麗海水族館、古宇利島、賞鯨"></textarea></label></p><div class="actions"><button id="generate">產生我的行程</button><button class="secondary" id="example">載入沖繩範例</button></div><p class="muted">本展示版使用內建景點資料與規則排程，不會連接付費 AI 或即時票價服務。</p></section><section id="result" class="panel"><h2>02 · 你的專屬旅遊計畫</h2><div id="summary"></div><h3>預算分配（每人估算）</h3><div class="budget" id="budgetCards"></div><p class="muted">預算為示意分配，不代表真實報價；請另行確認機票、交通、營業時間及預訂資訊。</p><div id="days"></div><div class="actions"><button id="save">儲存到此瀏覽器</button><button class="secondary" id="download">下載文字行程</button><button class="secondary" id="regenerate">重新排列</button></div><p id="status" class="muted" aria-live="polite"></p></section></main><footer>Travel Buddy · Vibe Coding 互動展示作品</footer><script>
const db={沖繩:['國際通','首里城公園','美國村','美麗海水族館','古宇利島','萬座毛','瀨長島','賞鯨','沖繩世界','JUNGLIA'],東京:['淺草寺','晴空塔','上野公園','澀谷','新宿御苑','東京迪士尼樂園','明治神宮','台場'],首爾:['景福宮','北村韓屋村','弘大','明洞','南山首爾塔','聖水洞','漢江公園'],瑞士:['蘇黎世老城','琉森湖','卡貝爾橋','因特拉肯','少女峰','格林德瓦','策馬特','馬特洪峰']};
const $=id=>document.getElementById(id);let current=null,rotation=0;const money=n=>'NT$ '+Math.round(n).toLocaleString('zh-TW');const localDate=d=>{let x=new Date(d+'T12:00:00');return x.toLocaleDateString('zh-TW',{month:'numeric',day:'numeric'})};
function readForm(){let start=$('start').value,end=$('end').value,people=Number($('people').value),budget=Number($('budget').value);if(!start||!end)throw Error('請先選擇出發與結束日期。');let n=Math.round((new Date(end+'T12:00:00')-new Date(start+'T12:00:00'))/86400000)+1;if(n<1||n>30)throw Error('旅行天數請設定為 1 至 30 天，且結束日期不可早於出發日期。');if(!Number.isInteger(people)||people<1||people>30||!Number.isFinite(budget)||budget<1000)throw Error('請輸入有效的人數（1–30）及每人預算（至少 NT$1,000）。');let wishes=$('wishes').value.split(/[,，、\n]+/).map(x=>x.trim()).filter(Boolean);return {destination:$('destination').value,start,end,people,budget,pace:$('pace').value,n,wishes};}
function build(){try{let f=readForm(),pool=[...new Set([...f.wishes,...db[f.destination]])],slots=f.pace==='悠閒'?2:f.pace==='充實'?4:3,days=[];for(let i=0;i<f.n;i++){let activities=[];for(let j=0;j<slots;j++)activities.push(pool[(i*slots+j+rotation)%pool.length]);days.push(activities)}current={...f,days};render();$('status').textContent='';}catch(e){alert(e.message)}}
function render(){let f=current;$('result').style.display='block';$('summary').textContent=`${f.destination} · ${f.n} 天 ${f.n-1} 夜 · ${f.people} 人 · ${f.pace}步調 · 每人 ${money(f.budget)}`;let parts=[['住宿',.3],['交通',.25],['餐飲',.2],['景點活動',.25]];$('budgetCards').replaceChildren(...parts.map(([name,ratio])=>{let el=document.createElement('div'),label=document.createElement('span'),v=document.createElement('strong');label.textContent=name;v.textContent=money(f.budget*ratio);el.append(label,v);return el}));$('days').replaceChildren(...f.days.map((acts,i)=>{let section=document.createElement('article');section.className='day';let h=document.createElement('h3');let d=new Date(f.start+'T12:00:00');d.setDate(d.getDate()+i);h.textContent=`Day ${i+1} · ${d.toLocaleDateString('zh-TW',{month:'numeric',day:'numeric'})}`;let ul=document.createElement('ul');acts.forEach((a,j)=>{let li=document.createElement('li');li.textContent=`${['上午','中午','下午','傍晚'][j]||'自由時間'}：${a}`;ul.append(li)});let p=document.createElement('p');p.className='muted';p.textContent='建議依景點位置、營業時間與實際交通調整順序。';section.append(h,ul,p);return section}));$('result').scrollIntoView({behavior:'smooth',block:'start'})}
$('generate').onclick=()=>{rotation=0;build()};$('regenerate').onclick=()=>{rotation++;build()};$('example').onclick=()=>{$('destination').value='沖繩';$('start').value='2027-01-05';$('end').value='2027-01-09';$('people').value=5;$('budget').value=20000;$('pace').value='平衡';$('wishes').value='賞鯨、美麗海水族館、古宇利島、JUNGLIA、美國村';build()};$('save').onclick=()=>{if(!current)return;try{localStorage.setItem('travelbuddy-plan',JSON.stringify(current));$('status').textContent='已儲存到此瀏覽器。'}catch(e){$('status').textContent='無法儲存，請檢查瀏覽器隱私設定。'}};function toText(f){return [`旅旅醬 · ${f.destination} 旅行計畫`,`${f.start} 至 ${f.end}｜${f.people} 人｜每人 ${money(f.budget)}｜${f.pace}步調`,'',...f.days.flatMap((a,i)=>[`Day ${i+1}`, ...a.map((x,j)=>`${j+1}. ${x}`),'']),'提醒：此為示意行程，須自行確認交通、營業時間及實際費用。'].join('\n')};$('download').onclick=()=>{if(!current)return;let blob=new Blob(['\ufeff'+toText(current)],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='旅旅醬-'+current.destination+'-行程.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};try{let saved=JSON.parse(localStorage.getItem('travelbuddy-plan'));if(saved&&Array.isArray(saved.days)){$('destination').value=saved.destination;$('start').value=saved.start;$('end').value=saved.end;$('people').value=saved.people;$('budget').value=saved.budget;$('pace').value=saved.pace;$('wishes').value=(saved.wishes||[]).join('、');current=saved;render();$('status').textContent='已還原上次儲存的行程。'}}catch(e){}
</script></body></html>
